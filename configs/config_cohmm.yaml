######## Data break-up #######
breakups_dictmodule:
  fit:
    _target_: config_utils.dict_module.DictModule
    module:
      _target_: config_utils.dict_module.DictSequential
      _args_:
        - _target_: config_utils.dict_module.DictModule
          module:
            _target_: utils.select
            _partial_: true
            trials_split: train
            neurons_split: [ heldin,heldout ]
          in_keys : [[data,obj]]
          out_keys: [selected_train]
        - _target_: config_utils.dict_module.DictModule
          module:
            _target_: utils.select
            _partial_: true
            trials_split: val
            neurons_split: [ heldin,heldout ]
          in_keys   : [[data, obj]]
          out_keys  : [selected_val] #[X_val,lengths_val]
        - _target_  : config_utils.dict_module.DictModule
          module    :
            _target_  : utils.flatten_with_lengths
            _partial_ : true
          in_keys   : [[selected_train,array]]
          out_keys  : [X,lengths]
        - _target_  : config_utils.dict_module.DictModule
          module    :
            _target_  : utils.flatten_with_lengths
            _partial_ : true
          in_keys   : [[selected_val,array]]
          out_keys  : [X_val,lengths_val]

    in_keys : [data]
    out_keys: [X,lengths,X_val,lengths_val]
#    out_keys: [selected_train,selected_val]



breakups:
  fit:
    train:
      trials_split: train
      neurons_split: [heldin,heldout]
    val:
      trials_split: val
      neurons_split: [heldin,heldout]

  k_shot_fit:
    input:
      trials_split: train
      neurons_split: heldin
    target:
      trials_split: train
      neurons_split: reallyheldout

  k_shot_test:
    input:
      trials_split: test
      neurons_split: heldin
    target:
      trials_split: test
      neurons_split: reallyheldout

  cosmoothing:
    input:
      trials_split: test
      neurons_split: heldin
    target:
      trials_split: test
      neurons_split: heldout

  decoding:
    fit:
      input:
        trials_split  : train
        neurons_split : heldin
      states:
        trials_split  : train
    test:
      input:
        trials_split  : test
        neurons_split : heldin
      states:
        trials_split  : test
