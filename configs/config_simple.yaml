defaults:
  - config_cohmm
  - _self_
####### multirun ##########
# uncomment the multirun_cohmm below if you want to train many student models
  - hydra: multirun_cohmm


# save paths. rename as you wish.
student_subpath: models_traintrials${train_trials}/ncomp${student.n_components}_${student_name}_id${student_index}
teacher_save_path: ${path_to_save_files}/all_models_validated_test/teacher_state${teacher.n_components}_${emission_mode}_partial_eps${teacher.transmat_epsilon}_length${length}
student_save_path: ${teacher_save_path}/${student_subpath}

use_teacher_as_student : false


analysis:
  compute_latent_decoding_linear    : true
  compute_co_smoothing              : true

### 4 state ring model
teacher:
  n_features: ${num_neurons_total}
  n_components: 4
  transmat_epsilon: 1e-2


### student with n_components
student:
  random_state:
    _target_: numpy.random.RandomState
    seed    : ${student_index}
  n_components: 12

# this index sets the random seed for initialisation
student_index: 4
