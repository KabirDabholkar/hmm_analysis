params:
  loc    : 0.5
  scale  : 1

name : normal

func_type : logpdf
estimated_param_name : [loc] #scale

dist:
  _target_  : scipy.stats.norm
  _partial_ : true

estimator:
  _target_  : numpy.mean
  _partial_ : true
  axis      : 0
  keepdims  : true

estimator_dictmodule:
  _target_: config_utils.dict_module.DictModule
  module  : ${estimator}
  in_keys   : [data_samples]
  out_keys  : [loc]


